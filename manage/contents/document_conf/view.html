<form method=POST action="?typex=document_conf" name="formx" enctype="multipart/form-data">
	{old_data}
	<input type=hidden name="cmd" />
	<table width="100%" border="0" cellpadding="0" cellspacing="0" class="theader">
		<tr><td width="100%">&nbsp;&nbsp;ブログ設定：
		<input type=submit id=btm value="保存" onclick="return usersave()" />
		&nbsp;&nbsp;ブログ&nbsp;&nbsp;<label><select name="id" onFocus="this.className='on';" onBlur="this.className='off'" style="width:180px" onchange="return ch_container();">{id}</select></label>
		</td></tr>
	</table>
	<br>


	<table width="100%" border="0" cellpadding="0" cellspacing="0" class="theader">
		<tr><td width="100%">&nbsp;&nbsp;基本データ</td></tr>
	</table>
	<table width="100%" cellpadding="0" cellspacing="0" class="tinput">
		<tr>
			<th width="180">外枠 テンプレート</th><td>&nbsp;<label><select name="container_temp_id" onFocus="this.className='on';" onBlur="this.className='off'" style="width:180px">{container_temp_id}</select></label></td>
		</tr>

		<tr>
			<th width="180">ページング タイプ</th><td>&nbsp;<label><select name="paging_temp_id" onFocus="this.className='on';" onBlur="this.className='off'" style="width:180px">{paging_temp_id}</select></label></td>
		</tr>
		<tr>
			<th width="180">１ページに表示するコンテンツ数(PC)</th><td>&nbsp;<label><select name="paging_count" onFocus="this.className='on';" onBlur="this.className='off'" style="width:180px">{paging_count}</select></label></td>
		</tr>
		<tr>
			<th width="180">一覧に表示するコンテンツ数(PC)</th><td>&nbsp;<label><select name="list_count" onFocus="this.className='on';" onBlur="this.className='off'" style="width:180px">{list_count}</select></label></td>
		</tr>
        <tr>
            <th width="180">１ページに表示するコンテンツ数(SP)</th><td>&nbsp;<label><select name="paging_count_sp" onFocus="this.className='on';" onBlur="this.className='off'" style="width:180px">{paging_count_sp}</select></label></td>
        </tr>
        <tr>
            <th width="180">一覧に表示するコンテンツ数(SP)</th><td>&nbsp;<label><select name="list_count_sp" onFocus="this.className='on';" onBlur="this.className='off'" style="width:180px">{list_count_sp}</select></label></td>
        </tr>
	</table>
	<br>

	<div>&nbsp;</div>
