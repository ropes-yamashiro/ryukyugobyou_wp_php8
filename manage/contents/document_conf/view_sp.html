<SCRIPT TYPE="text/javascript">

//更新データを保存する
function ch_container(){

	if(document.formx.container_temp_id_old.value != document.formx.container_temp_id.value
		|| document.formx.paging_temp_id_old.value != document.formx.paging_temp_id.value
		|| document.formx.paging_count_old.value != document.formx.paging_count.value){

		if(window.confirm('データが変更されていますが、ブログを切り替えますか？\n変更したデータは無効になります')){
        	document.formx.cmd.value = "ch_container";
	        document.formx.submit();
    	}
    	else{
    		document.formx.id.value = document.formx.id_old.value;
    	}
	}else{
    	document.formx.cmd.value = "ch_container";
    	document.formx.submit();
    }
    return false;
}

//更新データを保存する
function usersave(){
    if(window.confirm('データを保存してもいいですか？')){
        document.formx.cmd.value = "save";
        document.formx.submit();
    }
    return false;
}

</SCRIPT>
