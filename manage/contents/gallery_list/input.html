    //新規データを作成する

        document.formx.submit();

    }

    //ページを切り替える
    function ch_page(no){
        $("#cmd").val("view");
        $("#pageno").val(no);
        document.formx.submit();
        return false;
    }

    //新規データを作成する
    function new_gallery(){
        document.formx.action = "admin.php?typex=gallery_detail";
        document.formx.typex.value = "gallery_detail";
        document.formx.cmd.value = "view";
        document.formx.submit();
        return false;
    }

    //グループを変更する
    function ch_state(){
        document.formx.pageno.value = 1;
        document.formx.cmd.value="view";
        document.formx.submit();
        return false;
    }

    //表示を切り替える
    function ch_visible(id){
        document.formx.cmd.value="visible";
        document.formx.targetid.value = id;
        document.formx.submit();
        return false;
    }


    var onoff = false;
    function select_all(){
        onoff = onoff ? false :true ;
        $("input[name^='id_sel']").attr('checked',onoff);
    }

    //表示の切換え
    function chvisall(){
        if($("input[name^='id_sel']:checked").size() == 0 ) return false;
        if(window.confirm("選択した項目の表示を切り替えますか？")){
            document.formx.cmd.value = "chvisall";
            document.formx.submit();
        }
        return false;
    }

    //表示の切換え
    function removeall(){
        if($("input[name^='id_sel']:checked").size() == 0 ) return false;
        if(window.confirm("選択した項目の表示を削除しますか？")){
            document.formx.cmd.value = "removeall";
            document.formx.submit();
        }
        return false;
    }

    //表示の切換え
    function removeone(id,title){
        if(window.confirm('「' +　title +"」を削除しますか？")){
            document.formx.cmd.value = "removeone";
            document.formx.targetid.value = id;
            document.formx.submit();

        }
        return false;
    }

    //色付け
    function chBG2(obj, color){
        //alert("test");
        var bgcolors = new Array("", "#FFDDDD");
        //alert($("#" + obj).size());
        //$("#" + obj).css('background-color',bgcolors[color]);
        $("tr[name='" + obj + "']").css('background-color',bgcolors[color]);
    }


    //グループの切換え
    function ch_sel_group(){
        
        if($("select[name='chgroup'] option:selected").val() == 'label'){return false;}
        if($("input[name^='id_sel']:checked").size() == 0 ){return false;}
        if(window.confirm("選択した項目のグループを切り替えますか？")){
            document.formx.cmd.value = "chgrpall";
            document.formx.submit();
        }
        return false;
        
    }

    //ダイアログを表示する
    function popup_modal(){
        $("#cmd").val("view");
        document.formx.submit();
        return false;
    }


    //==========================================================================

    //位置を移動させる
    function moveitem(target,size,updown){
        $("#move_size").val(size);
        $("#move_type").val(updown);
        $("#targetid").val(target)
        $("#cmd").val("rotate");
        document.formx.submit();
        return false;
    }

    $(function() {
        $('a[rel*=facebox]').facebox({ closefunc:popup_modal, loadingImage : '../../jscript/facebox/loading.gif', closeImage : '../../jscript/facebox/closelabel.gif' });
    });

    // -->
</script>
