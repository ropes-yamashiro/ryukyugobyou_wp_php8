<form method="POST" name="formx" enctype="multipart/form-data" id="formx">
    {html_state}
    {html_paging}
    {id}
    <input type="hidden" name="cmd" id="cmd" />
    <input type="hidden" name="state_move_size" id="state_move_size" />
    <input type="hidden" name="state_move_type" id="state_move_type" />
    <table border="0" cellpadding="0" cellspacing="0" class="theader thcommand">
        <tr>
            <td class="tlefts">グループ詳細
                <input type="button" value="保存のみ"     onclick="return save()" />
                <input type="button" value="保存して一覧へ戻る" onclick="return saveback()" />
                <input type="button" value="一覧へ戻る"   onclick="return back();" />
            </td>
        </tr>
    </table>
    {html_err}
    <em>※は必須入力項目です。</em>
    <table cellpadding="0" cellspacing="0" class="theader">
        <tr><td class="tlefts">基本設定</td></tr>
    </table>
    <table  cellpadding="0" cellspacing="0" class="tinput2">
        <tr>
            <th class="thlabel">グループ名<em>※</em></th>
            <td class="tlefts"><input type="text" name="title" value="{title}" size="40" />
            </td>
        </tr>
        <tr>
            <th class="thlabel">コメント</th>
            <td class="tlefts"><textarea name="comment" cols="60" rows="5" id="editor1">{comment}</textarea></td>
        </tr>
        <tr>
            <th class="thlabel">表示順位</th>
            <td class="tlefts">
                {html_sort}
            </td>
    </table>
</form>
