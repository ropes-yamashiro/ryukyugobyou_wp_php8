@begin err_access
<font color="red">不正アクセスエラー：権限がありません</font>
@end

@begin err_cmd
<font color="red">不正アクセスエラー：{cmd}は定義されていません</font>
@end

@begin err_listview
<p style='color:red'>{value}</p><br>
@end


@begin paging
&nbsp;<a href="?" onClick="return ch_page({no});">{view}</a>
@end

@begin file_exist
<input type=hidden name="{name}" value="{fname}" />
&nbsp;&nbsp;{fname}&nbsp;&nbsp;&nbsp;&nbsp;<a href="javascript:;" onClick="delpic('{fid}','{fname}'); return false;">削除</a>
&nbsp;&nbsp;<a href="../{savepath}/{fname}" target="_blank" >表示</a>
@end

@begin file_nonexist
<input type=file name='{name}' onFocus="this.className='on';" onBlur="this.className='off';" size="35"  />
@end

@begin noval
<tr class="color1"><td colspan="5"><center>データがありません</center></td></tr>
@end

@begin line
		<tr class="color{color}" id="bg_id{id}" onmouseover="chBG('bg_id{id}', 1);" onmouseout="chBG('bg_id{id}', 0);">
		<td><label>&nbsp;&nbsp;<input type=checkbox name="id{id}" {visible} value="1" onClick="return ch_bool({id});" /></lable></td>
		<td><a href="?typex={typex}" onClick="return detail({id});" >{title}</a></td>
		<td>{class}</td>
		<td>{webtitle}</td>
		<td>{contentsname}</td>
		<td><a href="?typex={typex}" onClick="return del_line('{id}','{title}');">削除</a>
			<a href="?typex={typex}" onClick="return up_line('{sort}');">上へ</a>
			<a href="?typex={typex}" onClick="return down_line('{sort}');">下へ</a>
		</td>
		</tr>
@end


@begin page
<SCRIPT TYPE="text/javascript">
<!--
//ページを変更する
function ch_page(no){
    document.formx.action = "admin.php";
    document.formx.target = "";	
	document.formx.pageno.value=no;
	document.formx.submit();
	return false;
}

//表示の数を変える
function ch_count(){
    document.formx.action = "admin.php";
    document.formx.target = "";
	document.formx.pageno.value=1;
    document.formx.submit();
    return false;
}

//コンテンツを変える
function ch_contents(cd){
    document.formx.action = "admin.php";
    document.formx.target = "";
	document.formx.pageno.value=1;
    document.formx.submit();
    return false;
}


//項目を削除する
function del_line(cd,title){
    if(window.confirm(title + 'を削除しますか？')){
        document.formx.action = "admin.php";	
        document.formx.target = "";	
        document.formx.cmd.value = "del_line";
        document.formx.param.value = cd;
        document.formx.submit();
    }
    return false;
}


//新着情報を作成する
function newitem(){
    document.formx.action = "admin.php";	
    document.formx.target = "";	
    document.formx.cmd.value = "newitem";
    document.formx.submit();
    return false;
}

//上に移動する
function up_line(cd){
    document.formx.action = "admin.php";	
    document.formx.target = "";	
    document.formx.cmd.value = "up_line";
    document.formx.param.value = cd;
    document.formx.submit();
    return false;
}

//下に移動する
function down_line(cd){
    document.formx.action = "admin.php";	
    document.formx.target = "";	
    document.formx.cmd.value = "down_line";
    document.formx.param.value = cd;
    document.formx.submit();
    return false;
}

//表示を切り替える
function ch_bool(cd){
    document.formx.action = "admin.php";	
    document.formx.target = "";	
    document.formx.cmd.value = "ch_bool";
    document.formx.param.value = cd;
    document.formx.submit();
    return false;
}

//詳細を表示する
function detail(cd){
    document.formx.action = "admin.php";	
    document.formx.target = "";	
    document.formx.cmd.value = "detail";
    document.formx.param.value = cd;
    document.formx.submit();
    return false;
}

// -->
</SCRIPT> 
<form method="POST" name=formx action="?typex={typex}">
	<table width="100%" border="0" cellpadding="0" cellspacing="0" class="theader">
		<tr><td class="nrline">&nbsp;&nbsp;{name}：
		<input type=submit id=btm value="新規" onclick="return newitem();" />

		&nbsp;&nbsp;表示件数:
		<select name="count" id="select1" onchange="return ch_count();">
		    {count}
		</select>

		&nbsp;&nbsp;ブログ:
        <select name=contentsid onFocus="this.className='on';" onBlur="this.className='off'" onchange="return ch_contents();">{contentsid}</select>

		</td>
		<td class="nnline">{tcount}&nbsp;{paging}
		</td></tr>
	</table>
	<br>
	{err}
	
	<table width="590px" cellpadding="0" cellspacing="0" class="tlist">
		<tr>
			<th width="30px">表示</th>
			<th width="100px">カテゴリー名</th>
			<th width="70px">出力クラス</th>
			<th width="100px">表示用タイトル</th>
			<th width="110px">ブログ</th>
			<th width="115px">操作</th></tr>
		{table}
	</table>
		{hidden}
		<input type=hidden name="cmd" value="listview" />
		<input type=hidden name="param" />
</form>
@end
