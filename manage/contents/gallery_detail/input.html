<form method="POST" name="formx" enctype="multipart/form-data" id="formx">
    {html_state}
    {html_paging}
    {id}
    <input type="hidden" name="cmd" id="cmd" />
    <input type="hidden" name="state_move_size" id="state_move_size" />
    <input type="hidden" name="state_move_type" id="state_move_type" />
    <table border="0" cellpadding="0" cellspacing="0" class="theader thcommand">
        <tr>
            <td class="tlefts">画像詳細
                <input type="button" value="保存のみ"     onclick="return save()" />
                <input type="button" value="保存して一覧へ戻る" onclick="return saveback()" />
                <input type="button" value="一覧へ戻る"   onclick="return back();" />
            </td>
        </tr>
    </table>
    {html_err}
    <em>※は必須入力項目です。</em>
    <table cellpadding="0" cellspacing="0" class="theader">
        <tr><td class="tlefts">表示設定</td></tr>
    </table>
    <table  cellpadding="0" cellspacing="0" class="tinput2">
        <tr>
            <th class="thlabel">表示</th>
            <td class="tlefts">
                <label>
                    <input type="checkbox" name="isvisible" value="1" {isvisible_1} />ホームページに表示する
                </label>
            </td>
        </tr>
        <tr>
            <th class="thlabel">表示期間</th>
            <td class="tlefts">
                <label>
                    <input type="checkbox" name="useviewterm" value="1" {useviewterm_1} />表示期間を有効にする　
                </label>
                <input type="text" id="fromdate" name="fromdate" value="{fromdate}"  />～
                <input type="text" id="finishdate" name="finishdate" value="{finishdate}"   />
            </td>
        </tr>
        <tr>
            <th class="thlabel">グループ</th>
            <td class="tlefts"><select name="groupid">{html_group}</select>
                {html_group_edit}
            </td>
        </tr>
        <tr>
            <th class="thlabel">表示順位</th>
            <td class="tlefts">
                {html_sort}
            </td>
        </tr>
    </table>

    <table cellpadding="0" cellspacing="0" class="theader">
        <tr><td class="tlefts">画像情報</td></tr>
    </table>
    <table cellpadding="0" cellspacing="0" class="tinput2">
        <tr>
            <th class="thlabel">タイトル<em>※</em></th>
            <td class="tlefts"><textarea name="title" cols="60" rows="5" id="nontitle">{title}</textarea></td>
        </tr>
        <tr>
            <th class="thlabel">写真<em>※</em></th>
            <td class="tlefts"><i>写真を選択してください。（gif,jpeg,jpgファイル）</i><br /><i>写真サイズは最大１メガバイトを目安にしてください。</i><br />{html_img}</td>
        </tr>
        <tr>
            <th class="thlabel">リンクURL</th>
            <td class="tlefts">
                <input type="text" id="linkurl" name="linkurl" value="{linkurl}" size="60" />
                <input type="button" value="テスト" onclick="return jumplink($('#linkurl').val());">
            </td>
        </tr>
        <tr>
            <th class="thlabel">コメント１</th>
            <td class="tlefts"><textarea name="comment1" cols="60" rows="5" id="editor1">{comment1}</textarea></td>
        </tr>
        <tr>
            <th class="thlabel">コメント２</th>
            <td class="tlefts"><textarea name="comment2" cols="60" rows="5" id="editor2">{comment2}</textarea></td>
        </tr>

    </table>



</form>
