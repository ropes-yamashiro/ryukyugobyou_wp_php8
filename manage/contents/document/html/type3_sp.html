<script type="text/javascript">
	function summaryChanged(titleElement, summaryElement) {
		var length = summaryElement.value.length;
		titleElement.value = summaryElement.value.replace(/\r\n/g, " ").replace(/\n/g, " ").substring(0, (length > 18) ? 16 : length) + ((length > 18) ? "..." : "");
	}
	var titleElement = document.getElementsByName('title')[0];
	titleElement.parentNode.parentNode.parentNode.style.display = 'none';
	var summaryElement = document.getElementsByName('summary')[0];
	summaryChanged(titleElement, summaryElement);
	summaryElement.onblur = function() {summaryChanged(titleElement, this);};
</script>
