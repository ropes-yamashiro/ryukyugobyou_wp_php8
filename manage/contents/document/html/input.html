<style type="text/css">
    .thcommand{
        margin:0 0 15px 0;
    }

        width:100%;

        padding-left: 10px;

        width:100%;
        margin:0 0 15px 0;

    .tinput2 {

        border-spacing: 0px;
        font-size: x-small;
        line-height: 150%;
    }

    .tinput2 .thlabel {
        width: 80px;
        padding: 5px 10px 5px 10px;
        border-right: 1px solid #ccc;
        border-bottom: 1px solid #ccc;
        text-align: right;
        font-weight: normal;
        background-color: #DDDDDD;
    }

    .tinput2 .tlefts {
        padding: 5px 8px 5px 10px;
        border-right: 1px solid #ccc;

<form method=POST action="?typex=document" name="formx" enctype="multipart/form-data">
	<table width="100%" border="0" cellpadding="0" cellspacing="0" class="theader">
		<tr><td width="100%">&nbsp;&nbsp;ブログ&nbsp;&nbsp;{group}：
		<input type=submit id=btm value="保存のみ" onclick="return save();" />
		<input type=submit id=btm value="保存して一覧へ戻る" onclick="return savelist();" />
		<input type=submit id=Submit1 value="一覧へ戻る" onclick="return back();" />
		<input type=submit id=Submit1 value="プレビュー" onclick="return preview();" /></td></tr>
	</table>
	<br>
	
	{err}
    <em>※は必須入力項目です。</em>
	<table width="100%" border="0" cellpadding="0" cellspacing="0" class="theader">
		<tr><td width="100%">&nbsp;&nbsp;基本データ</td></tr>
	</table>
	<table width="100%" cellpadding="0" cellspacing="0" class="tinput2">
		<tr>
			<th width="80" class="thlabel">タイトル<em>※</em></th>
                        <td class="tlefts">&nbsp;<label><input type=text name=title onFocus="this.className='on';" onBlur="this.className='off'" value="{title}" style="width:400px" /></label></td>
		</tr>
		<tr>
			<th width="80" class="thlabel">表示形式</th>
			<td class="tlefts">
			&nbsp;<select name=viewtype onFocus="this.className='on';" onBlur="this.className='off'" onchange="return chtype();">{viewtype}</select>
			</td>
		</tr>
<!--category
		<tr>
			<th width="80" class="thlabel">カテゴリー<em>※</em></th>
			<td class="tlefts">
                {category}
			</td>
		</tr>
category-->
		<tr>
			<th width="80" class="thlabel">掲載開始日</th>
			<td class="tlefts">&nbsp;<select name=view_year onFocus="this.className='on';" onBlur="this.className='off'" >{view_year}</select>年
			    &nbsp;<select name=view_month onFocus="this.className='on';" onBlur="this.className='off'" >{view_month}</select>月
			    &nbsp;<select name=view_day onFocus="this.className='on';" onBlur="this.className='off'" >{view_day}</select>日<br>
                ※未来の日時を設定すると、設定日の0時に記事が反映されます。
			</td>
		</tr>
		<tr>
			<th width="80" class="thlabel">表示設定</th>
                        <td class="tlefts">&nbsp;<label><input type=checkbox name=visible value="1" size="37" {visible_1} />ホームページに表示する</label></td>
