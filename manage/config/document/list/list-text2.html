@begin main
<li>
	<a href="{self}" target="_top" class="clearfix">
	{contents}
	<p class="txt">
		<span class="category">{category}</span>
		<span class="day">{view_year}/{view_month}/{view_day}</span>
	</p>
	<p class="txt2">
		<span class="title">{title}</span>
    </p>
	</a>
</li>
@end

@begin image
<img src="{img}" width="{max-x}" height="{max-y}" class="disp_pc" />
<img src="{img}" width="{max-x_sp}" height="{max-y_sp}" class="disp_sp" />
@end

@begin item
<p class="{image-pos} thum left">
{image-left}{image-right}</p>
@end
