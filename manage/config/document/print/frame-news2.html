    <script type="text/javascript" src="js/dateformat.js"></script>     <!-- ブログフィード表示用 -->
    <script type="text/javascript" src="js/W3CDTF.js"></script>         <!-- ブログフィード表示用 -->
    <script type="text/javascript" src="js/jquery.js"></script>         <!-- ブログフィード表示用＆カテゴリ別件数表示用 -->
    <script type="text/javascript" src="js/jquery.jfeed.js"></script>   <!-- ブログフィード表示用 -->
    <script type="text/javascript" src="js/jquery.cms.js"></script>     <!-- ブログフィード表示＆カテゴリ別件数表示用 -->
    <script type="text/javascript">
        $(document).ready(function () {

            //  フィード取得＆表示処理
            //  ★使えるプレースホルダ
            //      {updated}       :ブログ記事の日付
            //      {title}         :ブログ記事の概要
            //      {description}   :ブログ記事の概要
            //      {link}          :当該ブログ記事ページへのリンクURL
            $("#blog").showFeed({
                url: 'rss.php',													            // フィードを取得するURL（省略可）
                gid: 1,																        //  ブログの種類のID（省略可）
                cnt: 20,                                                                    //  取得する件数（省略可）
                dateFormat: 'yyyy年M月d日',                                                 //  時刻のフォーマット文字列（dateformat.js）（省略可）
                headerTemplate: '<ul>',												        //  フィード表示部のヘッダテンプレート（省略可）
                itemTemplate: '<li><!--{updated}&nbsp;--><a href="{link}">{title}</a><br /></li><!--<p style="font-size: smaller;">{description}</p>-->',
        																			        //  フィード表示部の各エントリのテンプレート（省略可）
                footerTemplate: '</ul>'												        //  フィード表示部のフッタテンプレート（省略可）
            });

            //  カテゴリ別投稿数取得＆表示処理
            //  ★使えるプレースホルダ
            //      {title}     :CMS管理画面のカテゴリー設定での「カテゴリー名」
            //      {webtitle}  :CMS管理画面のカテゴリー設定での「表示用タイトル」
            //      {link}      :当該カテゴリのブログ記事ページへのリンクURL
            //      {count}     :当該カテゴリの記事件数
            $("#category").showCategory({
                url: 'category.php',                                                        //  カテゴリ別投稿件数を取得するURL（省略可）
                gid: 1,                                                                     //  ブログの種類のID（省略可）
                headerTemplate: '<ul>',                                                     //  ヘッダテンプレート（省略可）
                itemTemplate: '<li><a href="{link}">{webtitle}</a>&nbsp;({count})</li>',    //  1カテゴリ表示テンプレート（省略可）
                                                                                            //  （※CMS管理画面のカテゴリー設定での「表示用タイトル」は {webtitle} 「カテゴリー名」は {title} で表示できる
                emptyItemTemplate: '<li>{webtitle}&nbsp;({count})</li>',                    //  該当カテゴリの投稿数がゼロの場合に適用する1カテゴリ表示テンプレート（省略可）
                footerTemplate: '</ul>',                                                    //  フッタテンプレート（省略可）
                showEmptyItem: false                                                        //  カテゴリの投稿数がゼロの場合に当該カテゴリを表示する場合は true （省略可）
            });
            $("#category2").showCategory({
                url: 'category.php',                                                        //  カテゴリ別投稿件数を取得するURL（省略可）
                gid: 2,                                                                     //  ブログの種類のID（省略可）
                headerTemplate: '<ul>',                                                     //  ヘッダテンプレート（省略可）
                itemTemplate: '<li><a href="{link}">{webtitle}</a>&nbsp;({count})</li>',    //  1カテゴリ表示テンプレート（省略可）
                                                                                                //  （※CMS管理画面のカテゴリー設定での「表示用タイトル」は {webtitle} 「カテゴリー名」は {title} で表示できる
                emptyItemTemplate: '<li>{webtitle}&nbsp;({count})</li>',                    //  該当カテゴリの投稿数がゼロの場合に適用する1カテゴリ表示テンプレート（省略可）
                footerTemplate: '</ul>',                                                    //  フッタテンプレート（省略可）
                showEmptyItem: false                                                        //  カテゴリの投稿数がゼロの場合に当該カテゴリを表示する場合は true （省略可）
            });

        });
    </script>
