
@begin main
<!-- 1つの記事-->
<div id="id{id}" class="in clearfix">
<h3>{title}</h3>
<p class="date"><em>{view_year}/{view_month}/{view_day}</em></p>
<div class="top" {display-if(summary)}>{summary}</div>
{contents}
</div>
<!-- /1つの記事 -->
@end



@begin image
<p class="{image-pos} gallery">
<a href="{img}" target="_blank"><img src="{img}" width="{view-x}" height="{view-y}"/></a></p>
@end

@begin item
<!-- 写真単位 -->
<div class="block1">
{image-left}{image-right}
<div class="{text-pos}">{text}</div>
</div>
<!-- /写真単位 -->
@endimage-left
