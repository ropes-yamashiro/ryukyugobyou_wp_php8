
@begin main
<div id="id{id}" class="kiji_block clearfix">
<div class="top" {display-if(summary)}>{summary}</div>
<div class="block1">
{contents}
</div>
</div>

<!-- /1つの記事 -->
@end

@begin pdf
<div id="id{id}" class="in clearfix" style="margin: 0 0 0 30px;">
<p class="date">
{descpdf1}<br/>
<a href="manage/contents/document/pdf/{selpdf}">{descpdf}</a>
</p>
</div>
@end

@begin image
<p class="{image-pos} gallery">
<a href="{img}" target="_blank"><img src="{img}" width="{view-x}" height="{view-y}"/></a></p>
@end

@begin item
<!-- 写真単位 -->
<div class="block1">
{image-left}{image-right}
<div class="{text-pos}">{text}</div>
</div>
<!-- /写真単位 -->
@endimage-left
