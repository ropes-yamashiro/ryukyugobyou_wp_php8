//customer.phpが読込むファイル
top1 {
	gid: 1,2,3;
	//Topには複数のお客様の声の最新記事が掲載可能。※件数はこのconfigファイルで指定
	template: url("customer-top.html");
}

top2 {
	gid: 1;
	template: url("customer-top2.html");
}
top1sp {
	gid: 1sp,2sp;
	template: url("customer-top_sp.html");
}
top2sp {
	gid: 3sp;
	template: url("customer-top_sp2.html");
}

1 {
	type : page; //ここは固定
	customer: customer_info;
	template: url("customer-archive.html");
}
2 {
	type : page;
	customer: customer_info2;
	template: url("customer-archive2.html");
}
3 { 
	type : page;
	customer: customer_info3;
	template: url("customer-archive3.html");
}

1sp {
	type : page;
	customer: customer_info_sp;
	template: url("customer-archive_sp.html");
}

2sp {
	type : page;
	customer: customer_info_sp2;
	template: url("customer-archive_sp.html");
}



//1つ目PC
customer_info {
	type : line; //ここは固定
	top: 1;
	customerno : 1;

	linestart : url('customer-title.txt');
	lineend : url('customer-end.txt');
	linkline  : url('customer-link.txt');
	thumbnail_xmax : 60;
	img_link : 0;
	block_num : 2;

	morebtn: url('customer-morebtn.txt');
	pagecnt_top : 2;
	pagecnt : 1;
}
