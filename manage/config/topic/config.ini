//新着情報
topic_info {
	type : line;
	topicno : 1;

	nothing :   "<div class="in"><dl><dt>新着情報はございません。</dt><dd></dd></dl></div>";
	line :      url('topic-normal.txt');

	fileline : url('topic-file.txt' ,newfile);
	fileline : pdf, url('topic-file.txt' ,pdf);
	fileline : gif, url('topic-file.txt' ,img);
	fileline : jpg, url('topic-file.txt' ,img);
	fileline : jpeg, url('topic-file.txt' ,img);
	fileline : png, url('topic-file.txt' ,img);
	popline   : url('topic-window.txt');
	linkline  : url('topic-link.txt');
	titleline : url('topic-title.txt');
	contentsline : url('topic-contents.txt');

	window:     url('window.html');
	windowline: url('window-image.txt');
	window-noimage: url('window-noimage.html');
	thumbnail_xmax : 150;

}

